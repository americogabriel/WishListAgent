<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Wishlist</title>
  <style>
    /* Reset básico e tipografia */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f9;
      color: #1a1a1a;
      padding: 40px 20px;
      line-height: 1.5;
    }

    /* Cabeçalho */
    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2.2rem;
      color: #0f172a;
      margin-bottom: 8px;
    }

    header p {
      color: #64748b;
      font-size: 1rem;
    }

    /* Grid Layout dos Cards */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Estilo do Card Individual */
    .card {
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      margin-bottom: 16px;
      border-radius: 6px;
      background-color: #ffffff;
    }

    .title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.4;
      color: #334155;
      margin-bottom: 16px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .meta {
      margin-top: auto;
    }

    .price {
      font-size: 1.35rem;
      color: #16a34a;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .store {
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 16px;
    }

    .store strong {
      color: #334155;
    }

    /* Botão de Compra */
    .btn {
      display: block;
      width: 100%;
      background-color: #2563eb;
      color: #ffffff;
      text-align: center;
      text-decoration: none;
      padding: 10px 0;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>

  <header>
    <h1>🛒 Minha Wishlist</h1>
    <p>Lista de desejos atualizada com as melhores ofertas encontradas</p>
  </header>

  <main class="grid">
        <div class="card">
      <img src="https://images.unsplash.com/photo-1606813907291-d86efa9b94db" alt="Console PS5 Slim 1TB" loading="lazy">
      <div class="title">Console PS5 Slim 1TB</div>
      <div class="meta">
        <div class="price">R$ 3.499,00</div>
        <div class="store">Melhor oferta em: <strong>Amazon</strong></div>
        <a href="https://www.amazon.com.br/ps5" target="_blank" rel="noopener noreferrer" class="btn">Ver na Loja</a>
      </div>
    </div>
    <div class="card">
      <img src="https://images.unsplash.com/photo-1546435770-a3e426bf472b" alt="Headset Gamer HyperX" loading="lazy">
      <div class="title">Headset Gamer HyperX</div>
      <div class="meta">
        <div class="price">R$ 249,90</div>
        <div class="store">Melhor oferta em: <strong>Kabum</strong></div>
        <a href="https://www.kabum.com.br" target="_blank" rel="noopener noreferrer" class="btn">Ver na Loja</a>
      </div>
    </div>
  </main>

</body>
</html>
